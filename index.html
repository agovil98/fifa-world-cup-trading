        // Official World Cup 2026 Groups Map
        const WORLD_CUP_GROUPS = {
            "Group A": ["Mexico", "South Africa", "Korea Rep", "Czechia"],
            "Group B": ["Canada", "Switzerland", "Qatar", "Bosnia"],
            "Group C": ["Brazil", "Morocco", "Haiti", "Scotland"],
            "Group D": ["United States", "Paraguay", "Australia", "Türkiye"],
            "Group E": ["Germany", "Curaçao", "Côte d'Ivoire", "Ecuador"],
            "Group F": ["Netherlands", "Japan", "Tunisia", "Sweden"],
            "Group G": ["Belgium", "Egypt", "Iran", "New Zealand"],
            "Group H": ["Spain", "Cabo Verde", "Saudi Arabia", "Uruguay"],
            "Group I": ["France", "Senegal", "Norway", "Iraq"],
            "Group J": ["Argentina", "Algeria", "Austria", "Jordan"],
            "Group K": ["Portugal", "Uzbekistan", "Colombia", "Congo DR"],
            "Group L": ["England", "Croatia", "Ghana", "Panama"]
        };

        function App() {
            // Simplified point Matrix configuration state
            const [payouts, setPayouts] = useState({
                // Group Stage Points
                G1: 10,
                G2: 7,
                G3: 4,
                G4: 0,
                G3_ADV: 0, // Extra bonus for team finishing 3rd and advancing to R32
                // Knockout Stage Points
                L32: 15,
                L16: 25,
                QF: 40,
                SF: 70, 
                FINAL: 110, 
                CHAMP: 175, 
            });

            // CSV input and feedback states
            const [rawCsvText, setRawCsvText] = useState(DEFAULT_CSV_DATA);
            const [parsedTeams, setParsedTeams] = useState([]);
            const [errors, setErrors] = useState([]);
            const [warnings, setWarnings] = useState([]);
            const [dragActive, setDragActive] = useState(false);
            const [isExporting, setIsExporting] = useState(false);

            // Filtering & sorting states
            const [searchTerm, setSearchTerm] = useState("");
            const [sortBy, setSortBy] = useState("fairPrice"); // 'fairPrice', 'team', 'advProb'
            const [sortDir, setSortDir] = useState("desc");    // 'asc', 'desc'
            const [expandedTeam, setExpandedTeam] = useState(null); // name of clicked team
            
            // View Mode State: 'leaderboard' or 'groups'
            const [viewMode, setViewMode] = useState("leaderboard"); 

            // Ref for file input
            const fileInputRef = useRef(null);

            // Effect to parse the CSV whenever text updates
            useEffect(() => {
                parseCSV(rawCsvText);
            }, [rawCsvText]);

            const parseCSV = (csvText) => {
                if (!csvText || csvText.trim() === "") {
                    setErrors(["CSV input is empty."]);
                    setParsedTeams([]);
                    return;
                }

                const lines = csvText.split(/\r?\n/);
                const parsed = [];
                const parseErrors = [];
                const parseWarnings = [];

                if (lines.length < 2) {
                    setErrors(["CSV must contain at least a header row and one team data row."]);
                    setParsedTeams([]);
                    return;
                }

                // Parse header row
                const headers = lines[0].split(',').map(h => h.trim());
                const expectedHeaders = [
                    "Team", "G1", "G2", "G3", "G4", 
                    "L32", "L16", "QF", "SF", "FINAL", "CHAMP"
                ];

                // Verify exact header presence (case-insensitive for convenience but strict mapping)
                const headerMap = {};
                expectedHeaders.forEach(expected => {
                    const idx = headers.findIndex(h => h.toLowerCase() === expected.toLowerCase());
                    if (idx === -1) {
                        parseErrors.push(`Missing required column header: "${expected}"`);
                    } else {
                        headerMap[expected] = idx;
                    }
                });

                if (parseErrors.length > 0) {
                    setErrors(parseErrors);
                    setParsedTeams([]);
                    return;
                }

                // Parse team rows
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line === "") continue; // skip empty rows

                    const columns = line.split(',').map(c => c.trim());

                    if (columns.length < expectedHeaders.length) {
                        parseWarnings.push(`Line ${i + 1}: Row has fewer fields than expected. Skipping.`);
                        continue;
                    }

                    const team = columns[headerMap["Team"]];
                    if (!team) {
                        parseWarnings.push(`Line ${i + 1}: Missing Team Name. Skipping.`);
                        continue;
                    }

                    // Parse probabilities
                    const extractVal = (key) => {
                        const val = parseFloat(columns[headerMap[key]]);
                        return isNaN(val) ? 0 : val;
                    };

                    const teamObj = {
                        team,
                        G1: extractVal("G1"),
                        G2: extractVal("G2"),
                        G3: extractVal("G3"),
                        G4: extractVal("G4"),
                        L32: extractVal("L32"),
                        L16: extractVal("L16"),
                        QF: extractVal("QF"),
                        SF: extractVal("SF"),
                        FINAL: extractVal("FINAL"),
                        CHAMP: extractVal("CHAMP"),
                    };

                    // Mathematical validation
                    const groupSum = teamObj.G1 + teamObj.G2 + teamObj.G3 + teamObj.G4;
                    
                    if (Math.abs(groupSum - 1.00) > 0.01) {
                        parseWarnings.push(`[${team}] Group stage probabilities sum to ${(groupSum).toFixed(3)} instead of 1.000.`);
                    }

                    teamObj.advProb = teamObj.L32;
                    parsed.push(teamObj);
                }

                setParsedTeams(parsed);
                setErrors([]);
                setWarnings(parseWarnings);
            };

            // Drag and drop event handlers
            const handleDrag = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.type === "dragenter" || e.type === "dragover") {
                    setDragActive(true);
                } else if (e.type === "dragleave") {
                    setDragActive(false);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragActive(false);

                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    const file = e.dataTransfer.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setRawCsvText(event.target.result);
                    };
                    reader.readAsText(file);
                }
            };

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setRawCsvText(event.target.result);
                    };
                    reader.readAsText(file);
                }
            };

            // Dynamic EV Calculations
            const calculatedLeaderboard = useMemo(() => {
                return parsedTeams.map(teamItem => {
                    // Probability of finishing 3rd AND advancing to R32:
                    // P(G3 & Adv) = P(Adv to R32) - P(G1) - P(G2)
                    // Bounded between 0 and G3
                    const g3AdvProb = Math.max(0, Math.min(teamItem.G3, teamItem.L32 - teamItem.G1 - teamItem.G2));

                    // Group Stage EV
                    const groupEV = (teamItem.G1 * payouts.G1) +
                                    (teamItem.G2 * payouts.G2) +
                                    (teamItem.G3 * payouts.G3) +
                                    (teamItem.G4 * payouts.G4) +
                                    (g3AdvProb * payouts.G3_ADV);

                    // Knockout Stage EV
                    const koEV = (teamItem.L32 * payouts.L32) +
                                 (teamItem.L16 * payouts.L16) +
                                 (teamItem.QF * payouts.QF) +
                                 (teamItem.SF * payouts.SF) +
                                 (teamItem.FINAL * payouts.FINAL) +
                                 (teamItem.CHAMP * payouts.CHAMP);

                    const fairPrice = groupEV + koEV;

                    return {
                        ...teamItem,
                        g3AdvProb,
                        groupEV,
                        koEV,
                        fairPrice
                    };
                });
            }, [parsedTeams, payouts]);

            // Analytics Summaries
            const stats = useMemo(() => {
                if (calculatedLeaderboard.length === 0) {
                    return { count: 0, totalPool: 0, highest: null, lowest: null };
                }

                let total = 0;
                let highest = calculatedLeaderboard[0];
                let lowest = calculatedLeaderboard[0];

                calculatedLeaderboard.forEach(t => {
                    total += t.fairPrice;
                    if (t.fairPrice > highest.fairPrice) highest = t;
                    if (t.fairPrice < lowest.fairPrice) lowest = t;
                });

                return {
                    count: calculatedLeaderboard.length,
                    totalPool: total,
                    highest,
                    lowest,
                    average: total / calculatedLeaderboard.length
                };
            }, [calculatedLeaderboard]);

            // Filters
            const filteredAndSorted = useMemo(() => {
                let list = [...calculatedLeaderboard];

                if (searchTerm.trim() !== "") {
                    const query = searchTerm.toLowerCase();
                    list = list.filter(t => t.team.toLowerCase().includes(query));
                }

                list.sort((a, b) => {
                    let fieldA, fieldB;
                    if (sortBy === "fairPrice") {
                        fieldA = a.fairPrice;
                        fieldB = b.fairPrice;
                    } else if (sortBy === "advProb") {
                        fieldA = a.advProb;
                        fieldB = b.advProb;
                    } else { // Team name
                        fieldA = a.team.toLowerCase();
                        fieldB = b.team.toLowerCase();
                    }

                    if (fieldA < fieldB) return sortDir === "asc" ? -1 : 1;
                    if (fieldA > fieldB) return sortDir === "asc" ? 1 : -1;
                    return 0;
                });

                return list;
            }, [calculatedLeaderboard, searchTerm, sortBy, sortDir]);

            // Grouping Teams by Group A - Group L with intelligent alias-matching
            const groupedStandings = useMemo(() => {
                const groups = {};
                
                // Helper to match team names case-insensitively and handle aliases
                const getTeamByAlias = (name, list) => {
                    const normalizedName = name.toLowerCase().replace(/[^a-z0-9]/g, "");
                    return list.find(t => {
                        const normTeam = t.team.toLowerCase().replace(/[^a-z0-9]/g, "");
                        if (normTeam === normalizedName) return true;
                        if (normalizedName === "southkorea" && normTeam === "korearep") return true;
                        if (normalizedName === "korearep" && normTeam === "southkorea") return true;
                        if (normalizedName === "bosniaandherzegovina" && normTeam === "bosnia") return true;
                        if (normalizedName === "bosnia" && normTeam === "bosniaandherzegovina") return true;
                        return false;
                    });
                };

                Object.keys(WORLD_CUP_GROUPS).forEach(groupName => {
                    const teamNames = WORLD_CUP_GROUPS[groupName];
                    const teamsInGroup = teamNames.map(name => {
                        const matchedTeamObj = getTeamByAlias(name, calculatedLeaderboard);
                        if (matchedTeamObj) {
                            return matchedTeamObj;
                        }
                        // Fallback stub if not found in CSV
                        return {
                            team: name,
                            G1: 0, G2: 0, G3: 0, G4: 0,
                            L32: 0, L16: 0, QF: 0, SF: 0, FINAL: 0, CHAMP: 0,
                            groupEV: 0, koEV: 0, fairPrice: 0, advProb: 0,
                            isStub: true
                        };
                    });

                    // Sort teams inside the group by price descending
                    teamsInGroup.sort((a, b) => b.fairPrice - a.fairPrice);

                    // Compute dynamic total expected price for this group
                    const groupTotalPrice = teamsInGroup.reduce((sum, t) => sum + t.fairPrice, 0);

                    groups[groupName] = {
                        teams: teamsInGroup,
                        totalPrice: groupTotalPrice
                    };
                });

                return groups;
            }, [calculatedLeaderboard]);

            const handlePayoutChange = (key, value) => {
                const num = parseFloat(value);
                setPayouts(prev => ({
                    ...prev,
                    [key]: isNaN(num) ? 0 : num
                }));
            };

            const handleCsvExport = () => {
                setIsExporting(true);
                try {
                    let csv = "Rank,Team,Advancement Probability,Group Stage EV,Knockout EV,Calculated Fair Price\n";
                    const exportList = [...calculatedLeaderboard].sort((a, b) => b.fairPrice - a.fairPrice);
                    
                    exportList.forEach((teamItem, idx) => {
                        csv += `${idx + 1},"${teamItem.team.replace(/"/g, '""')}",${(teamItem.advProb * 100).toFixed(1)}%,${teamItem.groupEV.toFixed(2)},${teamItem.koEV.toFixed(2)},${teamItem.fairPrice.toFixed(2)}\n`;
                    });

                    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", `world_cup_2026_fair_prices.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (e) {
                    console.error("Export failed", e);
                } finally {
                    setIsExporting(false);
                }
            };

            const copyToClipboard = () => {
                let tableText = `FIFA World Cup 2026 Fair Value Leaderboard\n`;
                tableText += `Payoffs: Group G1: ${payouts.G1}pts | G2: ${payouts.G2}pts | G3: ${payouts.G3}pts | G4: ${payouts.G4}pts | G3_ADV: ${payouts.G3_ADV}pts\n`;
                tableText += `Knockout: L32: ${payouts.L32}pts | L16: ${payouts.L16}pts | QF: ${payouts.QF}pts | SF: ${payouts.SF}pts | FINAL: ${payouts.FINAL}pts | CHAMP: ${payouts.CHAMP}pts\n\n`;
                tableText += `Rank | Team    | Adv. % | Group EV | KO EV | Fair Price\n`;
                tableText += `-----|---------|--------|----------|-------|-----------\n`;

                const sortedList = [...calculatedLeaderboard].sort((a, b) => b.fairPrice - a.fairPrice);
                sortedList.forEach((t, i) => {
                    tableText += `${String(i + 1).padEnd(4)} | ${t.team.padEnd(7)} | ${(t.advProb * 100).toFixed(0).padStart(3)}% | ${t.groupEV.toFixed(1).padStart(8)} | ${t.koEV.toFixed(1).padStart(5)} | ${t.fairPrice.toFixed(2).padStart(9)}\n`;
                });

                navigator.clipboard.writeText(tableText).then(() => {
                    alert("Leaderboard copied to clipboard successfully!");

                    console.error('Could not copy text: ', err);

                                </div>

                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />

                                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />

                                            onClick={() => setRawCsvText(DEFAULT_CSV_DATA)}

                                            Reset Original Grid
                                        </button>
                                    </div>

                                {/* Validation Warnings (Floating points, sums != 1.00) */}

                                                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />

                                <h3 class="text-sm font-bold font-outfit uppercase tracking-wider text-slate-300 mb-5 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-brand-purple" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                                    </svg>

                                </h3>

                                <div class="space-y-6">
                                    {/* Section A: Group Stage Points */}

                                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
                                            <span class="w-1.5 h-1.5 rounded-full bg-brand-purple"></span>
                                            Group Stage Payoffs
                                        </h4>
                                        <div class="grid grid-cols-2 gap-3.5">
                                            <div>
                                                <label class="text-[10px] text-slate-400 block mb-1">G1 (1st Place)</label>
                                                <input 
                                                    type="number" 
                                                    value={payouts.G1}
                                                    onChange={(e) => handlePayoutChange("G1", e.target.value)}
                                                    class="w-full text-sm font-bold p-2 glass-input rounded-lg"
                                                />
                                            </div>
                                            <div>
                                                <label class="text-[10px] text-slate-400 block mb-1">G2 (2nd Place)</label>

                                                    value={payouts.G3}

                                        <div class="space-y-3.5">
                                            <div class="grid grid-cols-2 gap-3.5">

                                    >

                                    </button>
                                </div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mr-3 hidden sm:inline">World Cup 2026 Groups</span>
                            </div>

                            {/* Tab Mode A: Global Leaderboard View */}
                            {viewMode === "leaderboard" && (
                                <div class="glass-panel rounded-2xl p-5 flex flex-col flex-grow">

                                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-5 pb-5 border-b border-slate-800">
                                        <h2 class="text-base font-bold font-outfit text-white self-start sm:self-center flex items-center gap-2">
                                            <span>Calculated Fair Prices</span>
                                            <span class="text-xs bg-brand-purple/10 text-brand-purple border border-brand-purple/20 px-2 py-0.5 rounded-full font-sans font-medium">
                                                {filteredAndSorted.length} matches
                                            </span>
                                        </h2>

                                        {/* Inputs */}
                                        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                                            {/* Search Filter */}
                                            <div class="relative flex-grow sm:w-56">
                                                <input 
                                                    type="text" 
                                                    placeholder="Search by team..." 
                                                    value={searchTerm}
                                                    onChange={(e) => setSearchTerm(e.target.value)}
                                                    class="w-full text-xs py-2 pl-8 pr-3 rounded-lg glass-input"
                                                />
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500 absolute left-2.5 top-2.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                                </svg>
                                                {searchTerm && (
                                                    <button 
                                                        onClick={() => setSearchTerm("")}
                                                        class="absolute right-2.5 top-2 text-slate-500 hover:text-white text-xs"
                                                    >
                                                        ✕
                                                    </button>
                                                )}
                                            </div>

                                            {/* Sort By Dropdown */}
                                            <div class="flex items-center gap-1 text-xs">
                                                <span class="text-slate-400 hidden sm:inline">Sort:</span>
                                                <select
                                                    value={sortBy}
                                                    onChange={(e) => setSortBy(e.target.value)}
                                                    class="py-2 px-2 rounded-lg glass-input text-xs font-medium bg-slate-900 cursor-pointer"
                                                >
                                                    <option value="fairPrice">Fair Price</option>
                                                    <option value="advProb">Adv. Prob %</option>
                                                    <option value="team">Team (A-Z)</option>
                                                </select>
                                            </div>

                                            {/* Sort Order Toggle */}
                                            <button
                                                onClick={() => setSortDir(prev => prev === "desc" ? "asc" : "desc")}
                                                class="py-2 px-2.5 rounded-lg glass-input text-xs font-bold hover:text-white"
                                                title="Toggle Direction"
                                            >
                                                {sortDir === "desc" ? "↓ DESC" : "↑ ASC"}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Results Table */}
                                    <div class="overflow-x-auto w-full">
                                        {filteredAndSorted.length === 0 ? (
                                            <div class="py-12 text-center text-slate-500 text-sm">
                                                No teams matching "{searchTerm}" found. Check your search query or CSV file.
                                            </div>
                                        ) : (
                                            <table class="w-full border-collapse text-left">
                                                <thead>
                                                    <tr class="border-b border-slate-800 text-[10px] uppercase font-bold text-slate-400 tracking-wider">
                                                        <th class="py-3 px-3 w-12 text-center">Rank</th>
                                                        <th class="py-3 px-3">Team</th>
                                                        <th class="py-3 px-3 text-right">Group EV</th>
                                                        <th class="py-3 px-3 text-right">KO EV</th>
                                                        <th class="py-3 px-3 text-center">Adv. %</th>
                                                        <th class="py-3 px-3 text-right text-brand-emerald">Fair Price</th>
                                                        <th class="py-3 px-3 hidden md:table-cell">Stage Probabilities Stack (G1-G4)</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {filteredAndSorted.map((teamItem, index) => {
                                                        const isExpanded = expandedTeam === teamItem.team;
                                                        
                                                        return (
                                                            <React.Fragment key={teamItem.team}>
                                                                {/* Standard row */}
                                                                <tr 
                                                                    onClick={() => setExpandedTeam(isExpanded ? null : teamItem.team)}
                                                                    class={`border-b border-slate-800/40 hover:bg-slate-800/25 transition cursor-pointer text-xs ${isExpanded ? 'bg-slate-800/20' : ''}`}
                                                                >
                                                                    {/* Rank */}
                                                                    <td class="py-3.5 px-3 text-center font-bold text-slate-500 font-outfit">
                                                                        {sortDir === "desc" ? index + 1 : filteredAndSorted.length - index}
                                                                    </td>

                                                                    {/* Team */}
                                                                    <td class="py-3.5 px-3 font-semibold font-outfit text-white text-sm flex items-center gap-2">
                                                                        <span class="w-2.5 h-2.5 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center text-[7px] text-slate-400 font-sans">
                                                                            {teamItem.team[0]}
                                                                        </span>
                                                                        {teamItem.team}
                                                                        {isExpanded ? (
                                                                            <span class="text-[9px] text-brand-purple font-sans font-normal ml-1">▲ Hide Details</span>
                                                                        ) : (
                                                                            <span class="text-[9px] text-slate-500 font-sans font-normal ml-1 hover:text-slate-300">▼ Show Details</span>
                                                                        )}
                                                                    </td>

                                                                    {/* Group Stage Expected Value */}
                                                                    <td class="py-3.5 px-3 text-right font-mono text-slate-400">
                                                                        {teamItem.groupEV.toFixed(2)}
                                                                    </td>

                                                                    {/* Knockout Stage Expected Value */}
                                                                    <td class="py-3.5 px-3 text-right font-mono text-slate-400">
                                                                        {teamItem.koEV.toFixed(2)}
                                                                    </td>

                                                                    {/* Advancement Probability (L32) */}
                                                                    <td class="py-3.5 px-3 text-center font-semibold text-brand-sapphire font-mono">
                                                                        {(teamItem.advProb * 100).toFixed(1)}%
                                                                    </td>

                                                                    {/* Calculated Fair Price */}
                                                                    <td class="py-3.5 px-3 text-right text-base font-extrabold font-outfit text-brand-emerald">
                                                                        {teamItem.fairPrice.toFixed(2)}
                                                                    </td>

                                                                    {/* Visual probability stack bar chart */}
                                                                    <td class="py-3.5 px-3 hidden md:table-cell">
                                                                        <div class="flex items-center gap-1.5 w-full">
                                                                            <div class="h-2 rounded-full flex-grow overflow-hidden flex bg-slate-800 max-w-[160px]">
                                                                                <div class="bg-brand-purple h-full" style={{ width: `${teamItem.G1 * 100}%` }} title={`G1: ${(teamItem.G1*100).toFixed(0)}%`}></div>
                                                                                <div class="bg-brand-sapphire h-full" style={{ width: `${teamItem.G2 * 100}%` }} title={`G2: ${(teamItem.G2*100).toFixed(0)}%`}></div>
                                                                                <div class="bg-brand-amber h-full" style={{ width: `${teamItem.G3 * 100}%` }} title={`G3: ${(teamItem.G3*100).toFixed(0)}%`}></div>
                                                                                <div class="bg-brand-rose h-full" style={{ width: `${teamItem.G4 * 100}%` }} title={`G4: ${(teamItem.G4*100).toFixed(0)}%`}></div>
                                                                            </div>
                                                                            <span class="text-[9px] text-slate-500 font-mono">G1:{(teamItem.G1*100).toFixed(0)}%</span>
                                                                        </div>
                                                                    </td>
                                                                </tr>

                                                                {/* Expandable Breakdown Drawer Row */}
                                                                {isExpanded && (
                                                                    <tr>
                                                                        <td colSpan="7" class="bg-slate-900/60 p-4 border-b border-slate-800/40">
                                                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                                
                                                                                {/* Column 1: Group stage breakdown */}
                                                                                <div class="bg-slate-950/40 rounded-xl p-3 border border-slate-800/60">
                                                                                    <div class="text-[10px] font-bold text-brand-purple uppercase tracking-wider mb-2">Group Stage breakdown (G1 - G4)</div>
                                                                                    <div class="space-y-2 text-xs">
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">G1 (1st):</span>
                                                                                            <span class="font-mono font-semibold">{(teamItem.G1 * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.G1 * payouts.G1).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">G2 (2nd):</span>
                                                                                            <span class="font-mono font-semibold">{(teamItem.G2 * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.G2 * payouts.G2).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">G3 (3rd):</span>
                                                                                            <span class="font-mono font-semibold">{(teamItem.G3 * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.G3 * payouts.G3).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">G4 (4th):</span>
                                                                                            <span class="font-mono font-semibold">{(teamItem.G4 * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.G4 * payouts.G4).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center text-brand-purple">
                                                                                            <span class="text-brand-purple font-medium">G3 & Adv (Bonus):</span>
                                                                                            <span class="font-mono font-semibold">{(teamItem.g3AdvProb * 100).toFixed(2)}% <span class="text-[10px] opacity-75">({(teamItem.g3AdvProb * payouts.G3_ADV).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="border-t border-slate-800/80 pt-1.5 flex justify-between items-center font-semibold text-white">
                                                                                            <span>Expected Group EV:</span>
                                                                                            <span class="font-mono text-brand-purple">{teamItem.groupEV.toFixed(2)} pts</span>
                                                                                        </div>
                                                                                    </div>
                                                                                </div>

                                                                                {/* Column 2: Knockout stage breakdown */}
                                                                                <div class="bg-slate-950/40 rounded-xl p-3 border border-slate-800/60">
                                                                                    <div class="text-[10px] font-bold text-brand-emerald uppercase tracking-wider mb-2">Knockout Stage Cumulative Probabilities</div>
                                                                                    <div class="space-y-1.5 text-xs max-h-48 overflow-y-auto pr-1">
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">L32 (Reach R32):</span>
                                                                                            <span class="font-mono">{(teamItem.L32 * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.L32 * payouts.L32).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">L16 (Reach R16):</span>
                                                                                            <span class="font-mono">{(teamItem.L16 * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.L16 * payouts.L16).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">QF (Reach QF):</span>
                                                                                            <span class="font-mono">{(teamItem.QF * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.QF * payouts.QF).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">SF (Reach Semis):</span>
                                                                                            <span class="font-mono">{(teamItem.SF * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.SF * payouts.SF).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-400">FINAL (Reach Final):</span>
                                                                                            <span class="font-mono">{(teamItem.FINAL * 100).toFixed(2)}% <span class="text-[10px] text-slate-500">({(teamItem.FINAL * payouts.FINAL).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="flex justify-between items-center">
                                                                                            <span class="text-slate-300 font-medium">CHAMP (Champion):</span>
                                                                                            <span class="font-mono font-bold text-emerald-400">{(teamItem.CHAMP * 100).toFixed(2)}% <span class="text-[10px] text-slate-400">({(teamItem.CHAMP * payouts.CHAMP).toFixed(2)} pts)</span></span>
                                                                                        </div>
                                                                                        <div class="border-t border-slate-800/80 pt-1.5 flex justify-between items-center font-semibold text-white">
                                                                                            <span>Expected Knockout EV:</span>
                                                                                            <span class="font-mono text-brand-emerald">{teamItem.koEV.toFixed(2)} pts</span>
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                )}
                                                            </React.Fragment>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Tab Mode B: Group-by-Group Standing View */}
                            {viewMode === "groups" && (
                                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                    {Object.keys(groupedStandings).map(groupName => {
                                        const groupData = groupedStandings[groupName];
                                        return (
                                            <div key={groupName} class="glass-panel rounded-2xl overflow-hidden flex flex-col justify-between border-t-2 border-t-brand-purple glow-hover">
                                                {/* Group Header */}
                                                <div class="bg-slate-900/60 px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                                                    <span class="font-bold text-sm text-white tracking-wide font-outfit uppercase">{groupName}</span>
                                                    <span class="text-[10px] font-mono bg-slate-800 border border-slate-700 text-slate-300 py-0.5 px-2 rounded-full font-bold">
                                                        Total EV: {groupData.totalPrice.toFixed(1)} pts
                                                    </span>
                                                </div>

                                                {/* Teams list ordered by price */}
                                                <div class="p-4 divide-y divide-slate-800/40 flex-grow">
                                                    {groupData.teams.map((teamItem, idx) => {
                                                        const isExpanded = expandedTeam === teamItem.team;
                                                        
                                                        return (
                                                            <div key={teamItem.team} class="py-2.5 first:pt-0 last:pb-0">
                                                                <div 
                                                                    onClick={() => setExpandedTeam(isExpanded ? null : teamItem.team)}
                                                                    class="flex items-center justify-between cursor-pointer group/item"
                                                                >
                                                                    <div class="flex items-center gap-2 overflow-hidden">
                                                                        <span class="text-[10px] text-slate-500 font-bold font-mono">#{idx+1}</span>
                                                                        <span class="font-semibold text-xs text-slate-200 group-hover/item:text-white truncate">
                                                                            {teamItem.team}
                                                                        </span>
                                                                        {teamItem.isStub && (
                                                                            <span class="text-[8px] bg-brand-rose/25 text-brand-rose px-1 rounded-sm">Missing</span>
                                                                        )}
                                                                    </div>
                                                                    <div class="flex items-center gap-2 shrink-0">
                                                                        <span class="text-[10px] font-mono text-slate-500">{(teamItem.advProb * 100).toFixed(0)}% adv</span>
                                                                        <span class="font-extrabold text-sm text-brand-emerald font-outfit">
                                                                            {teamItem.fairPrice.toFixed(1)}
                                                                        </span>
                                                                    </div>
                                                                </div>

                                                                {/* Expansion details Inside Group Standing Card */}
                                                                {isExpanded && !teamItem.isStub && (
                                                                    <div class="mt-2.5 bg-slate-950/60 p-3 rounded-lg border border-slate-800/40 text-[10px] space-y-2">
                                                                        <div class="grid grid-cols-2 gap-2 text-slate-400 font-mono">
                                                                            <div>G1 (1st): <span class="text-white font-bold">{(teamItem.G1*100).toFixed(0)}%</span></div>
                                                                            <div>L32 (R32): <span class="text-white font-bold">{(teamItem.L32*100).toFixed(0)}%</span></div>
                                                                            <div>G2 (2nd): <span class="text-white font-bold">{(teamItem.G2*100).toFixed(0)}%</span></div>
                                                                            <div>L16 (R16): <span class="text-white font-bold">{(teamItem.L16*100).toFixed(0)}%</span></div>
                                                                            <div>G3 (3rd): <span class="text-white font-bold">{(teamItem.G3*100).toFixed(0)}%</span></div>
                                                                            <div>QF (QF): <span class="text-white font-bold">{(teamItem.QF*100).toFixed(0)}%</span></div>
                                                                            <div>G4 (4th): <span class="text-white font-bold">{(teamItem.G4*100).toFixed(0)}%</span></div>
                                                                            <div>SF (Semis): <span class="text-white font-bold">{(teamItem.SF*100).toFixed(0)}%</span></div>
                                                                        </div>
                                                                        {payouts.G3_ADV > 0 && (
                                                                            <div class="border-t border-slate-800/40 pt-1 text-[9px] text-brand-purple font-mono flex justify-between">
                                                                                <span>G3 & Adv Bonus Prob:</span>
                                                                                <span class="font-bold">{(teamItem.g3AdvProb * 100).toFixed(1)}% ({((teamItem.g3AdvProb) * payouts.G3_ADV).toFixed(1)} pts)</span>
                                                                            </div>
                                                                        )}
                                                                        <div class="border-t border-slate-800 pt-1.5 flex justify-between font-bold text-white text-[11px]">
                                                                            <span>Expected EV:</span>
                                                                            <span class="text-brand-emerald">{teamItem.fairPrice.toFixed(2)} pts</span>
                                                                        </div>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </section>
                    </main>

                    {/* App Footer */}
                    <footer class="w-full border-t border-slate-900 glass-panel py-4 px-8 mt-12 text-center text-xs text-slate-500">
                        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                            <span>FIFA World Cup 2026 Fair Value trading algorithm. Designed for high fidelity sports trading pools.</span>
                            <div class="flex items-center gap-4">
                                <a href="file:///Users/anirudhgovil/.gemini/antigravity/scratch/fifa-world-cup-trading/README.md" class="hover:text-slate-300 underline">Read Documentation</a>
                                <span>v1.0.0 (Babel/React Standalone)</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render application using ReactDOM 18 createRoot
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
